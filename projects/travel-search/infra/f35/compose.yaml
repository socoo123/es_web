name: es-framework-f35
x-common: &common
  image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
  labels: {esweb.lesson: f35}
  mem_limit: 640m
  secrets: [admin_password]
  environment: &environment
    cluster.name: travel-f35-lab
    network.host: 0.0.0.0
    discovery.seed_hosts: n1:9300
    xpack.security.enabled: "true"
    xpack.security.autoconfiguration.enabled: "false"
    xpack.security.http.ssl.enabled: "true"
    xpack.security.http.ssl.certificate_authorities: certs/ca.crt
    xpack.security.http.ssl.client_authentication: none
    xpack.security.transport.ssl.enabled: "true"
    xpack.security.transport.ssl.verification_mode: full
    xpack.security.transport.ssl.client_authentication: required
    xpack.security.transport.ssl.certificate_authorities: certs/ca.crt
    xpack.ml.enabled: "false"
    ELASTIC_PASSWORD_FILE: /run/secrets/admin_password
    ES_JAVA_OPTS: -Xms192m -Xmx192m
  ulimits:
    nofile: {soft: 65535, hard: 65535}
services:
  n1:
    <<: *common
    environment:
      <<: *environment
      node.name: travel-f35-n1
      node.roles: master,data,ingest
      xpack.security.http.ssl.key: certs/n1/server.key
      xpack.security.http.ssl.certificate: certs/n1/server.crt
      xpack.security.transport.ssl.key: certs/n1/server.key
      xpack.security.transport.ssl.certificate: certs/n1/server.crt
    networks: {default: {ipv4_address: 172.30.35.11}}
    ports: ["127.0.0.1:19935:9200"]
    volumes: ["n1-data:/usr/share/elasticsearch/data", "certs:/usr/share/elasticsearch/config/certs:ro"]
  n2:
    <<: *common
    environment:
      <<: *environment
      node.name: travel-f35-n2
      node.roles: data
      xpack.security.http.ssl.key: certs/n2/server.key
      xpack.security.http.ssl.certificate: certs/n2/server.crt
      xpack.security.transport.ssl.key: certs/n2/server.key
      xpack.security.transport.ssl.certificate: certs/n2/server.crt
    networks: {default: {ipv4_address: 172.30.35.12}}
    ports: ["127.0.0.1:19936:9200"]
    volumes: ["n2-data:/usr/share/elasticsearch/data", "certs:/usr/share/elasticsearch/config/certs:ro"]
secrets:
  admin_password:
    file: .local/admin-password.txt
volumes:
  n1-data:
    name: es-framework-f35-n1-data
    labels: {esweb.lesson: f35}
  n2-data:
    name: es-framework-f35-n2-data
    labels: {esweb.lesson: f35}
  certs:
    name: es-framework-f35-certs
    labels: {esweb.lesson: f35}
networks:
  default:
    ipam:
      config: [{subnet: 172.30.35.0/24}]
