name: es-framework-f21
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    environment:
      cluster.name: travel-f21-lab
      node.name: travel-f21-01
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19221:9200"
    mem_limit: 1g
    volumes:
      - f21-data:/usr/share/elasticsearch/data
volumes:
  f21-data:
