spring.application.name=travel-search
server.address=127.0.0.1
server.port=${APP_PORT:18080}
travel.es-url=${ES_URL:http://127.0.0.1:19200}
travel.es-ca-file=${ES_CA_FILE:}
travel.es-api-key-file=${ES_API_KEY_FILE:}
travel.index=${ES_INDEX:tut-f07-attractions}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.accept-float-as-int=false
