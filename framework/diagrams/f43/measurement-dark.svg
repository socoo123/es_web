<tspan x="366" dy="0">两路并行观测</tspan><tspan x="366" dy="23">客户端：起止 / 成功 / 错误 / 延迟分位数</tspan><tspan x="366" dy="23">ES：计数器差 / 写入压力 / GC / 堆 / 磁盘</tspan></text></g><g class="dmVyaWZ5 card"><g class="shape" ><rect x="9" y="877" width="714" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="366" y="920.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="366" dy="0">先核对正确，再解释测量</tspan><tspan x="366" dy="24">全部 _source / ID / 总数 / 搜索与 Java；窗口短就保留不确定性</tspan></text></g><g class="KGlucHV0IC0mZ3Q7IHdhcm0pWzBd"><marker id="mk-d2-682996279-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 366 94.5 C 366 141.300003 366 165.699997 366 210.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-682996279-3488378134)" mask="url(#d2-682996279)" /><text x="366.5" y="159" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">一次只改一个主要条件</text></g><g class="KHdhcm0gLSZndDsgd2luZG93KVswXQ=="><path d="M 366 308.5 C 366 355.299988 366 379.700012 366 424.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-682996279-3488378134)" mask="url(#d2-682996279)" /><text x="366.5" y="373" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">预热后开始统计</text></g><g class="KHdpbmRvdyAtJmd0OyBldmlkZW5jZSlbMF0="><path d="M 366 522.5 C 366 569.299988 366 593.700012 366 638.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-682996279-3488378134)" mask="url(#d2-682996279)" /><text x="366.5" y="587" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">慢请求降低闭环发出速率；监控也有开销</text></g><g class="KGV2aWRlbmNlIC0mZ3Q7IHZlcmlmeSlbMF0="><path d="M 366 757.5 C 366 804.299988 366 828.700012 366 873.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-682996279-3488378134)" mask="url(#d2-682996279)" /><text x="366.5" y="822" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">吞吐包含尾部排空；计数器区间另含预热</text></g><mask id="d2-682996279" maskUnits="userSpaceOnUse" x="-25" y="-25" width="782" height="1020">
