" /></g><text x="331.5" y="233.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="331.5" dy="0">备份完成后改价 + 误删 → 主副本都接收变化</tspan><tspan x="331.5" dy="23">两节点分别读取：p01 = 6500 分，无 p02，共 5 条</tspan></text></g><g class="YmFja3VwLmE= card"><g class="shape" ><rect x="60" y="442" width="562" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="341" y="484.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="341" dy="0">before-delete · SUCCESS，2 分片成功 / 0 失败</tspan><tspan x="341" dy="23">2 指原分片数；不是主副本共 4 份各做一次备份</tspan></text></g><g class="YmFja3VwLmI= card"><g class="shape" ><rect x="60" y="573" width="562" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="341" y="615.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="341" dy="0">独立恢复名 → 完整 ID / 字段 / mapping / 查询核对</tspan><tspan x="341" dy="23">p01 = 6000 分，p02 再现，共 6 条；实时索引仍 5 条</tspan></text></g><g class="Ym91bmRhcnkuYQ== card"><g class="shape" ><rect x="60" y="824" width="614" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="367" y="866.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="367" dy="0">n1、n2 同挂仓库卷，同一路径 + path.repo</tspan><tspan x="367" dy="23">数据卷与仓库卷仍在同一 Docker VM / 宿主盘</tspan></text></g><g class="Ym91bmRhcnkuYg== card"><g class="shape" ><rect x="60" y="955" width="614" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="367" y="997.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="367" dy="0">实际容灾还需独立故障域、访问保护与定期恢复演练</tspan><tspan x="367" dy="23">误删传播到副本；仓库丢失也会失去备份</tspan></text></g><mask id="d2-2976193959" maskUnits="userSpaceOnUse" x="-25" y="-25" width="784" height="1156">
