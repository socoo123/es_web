e-B1 fill-B5" style="stroke-width:2;" /></g><text x="478.5" y="353.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="478.5" dy="0">before-delete：SUCCESS，2 成功 / 0 失败</tspan><tspan x="478.5" dy="23">可进入完整恢复核对，仍不能只凭状态切换入口</tspan></text></g><g class="Y29tcGxldGUuYg== card"><g class="shape" ><rect x="60" y="442" width="837" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="478.5" y="484.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="478.5" dy="0">missing-primary 元数据：PARTIAL，2 成功 / 1 失败</tspan><tspan x="478.5" dy="23">_status 却显示 SUCCESS；risk 仅在 n2，停 n2 后缺失主分片，备份不含该资料</tspan></text></g><g class="Y29tcGxldGUuYw== card"><g class="shape" ><rect x="60" y="573" width="837" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="478.5" y="615.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="478.5" dy="0">默认拒绝恢复不完整索引 → 500</tspan><tspan x="478.5" dy="23">显式 partial = true：恢复可返回 200，risk 却从 1 条变 0 条</tspan></text></g><g class="cmVzdG9yZS5h card"><g class="shape" ><rect x="60" y="824" width="580" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="350" y="866.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="350" dy="0">直接恢复到已打开同名索引 → 500</tspan><tspan x="350" dy="23">rename + 不恢复全局状态 / alias → 独立目标</tspan></text></g><g class="cmVzdG9yZS5i card"><g class="shape" ><rect x="60" y="955" width="580" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="350" y="997.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="350" dy="0">核对全字段、6 条、p01 / p02、查询与副本可读</tspan><tspan x="350" dy="23">再移动 read alias；原实时