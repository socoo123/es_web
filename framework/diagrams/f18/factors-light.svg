bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="143" dy="0">把解释项放回当前条件</tspan><tspan x="143" dy="17.666667">词频＋稀有程度＋长度归一</tspan><tspan x="143" dy="17.666667">得分不等于相关概率</tspan></text></g><g class="KGZyZXEgLSZndDsgbGVuZ3RoKVswXQ==" style='opacity:0'><marker id="mk-d2-719890357-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 143 100 C 143 138 143 158 143 194" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-719890357-3488378134)" mask="url(#d2-719890357)" /></g><g class="KGxlbmd0aCAtJmd0OyByYXJlKVswXQ==" style='opacity:0'><path d="M 143 298 C 143 336 143 356 143 392" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-719890357-3488378134)" mask="url(#d2-719890357)" /></g><g class="KHJhcmUgLSZndDsgcmVhZClbMF0=" style='opacity:0'><path d="M 143 496 C 143 534 143 554 143 590" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-719890357-3488378134)" mask="url(#d2-719890357)" /></g><mask id="d2-719890357" maskUnits="userSpaceOnUse" x="-25" y="-25" width="336" height="742">
