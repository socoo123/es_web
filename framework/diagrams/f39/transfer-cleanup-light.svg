" dy="0">正确路由 · 重算旧 p01 与新 p02</tspan><tspan x="271.5" dy="24">p01.tags = [亲水]；p02.tags = [亲水, 夜景]</tspan></text></g><g class="ZQ== card"><g class="shape" ><rect x="7" y="856" width="529" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="271.5" y="899.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="271.5" dy="0">再删除 p01 最后一条标签 t01</tspan><tspan x="271.5" dy="24">由 before 找到 p01；完整 index 明确写 tags = []</tspan></text></g><g class="Zg== card"><g class="shape" ><rect x="6" y="1070" width="531" height="114" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="271.5" y="1113.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="271.5" dy="0">根记录的资格决定文档是否存在</tspan><tspan x="271.5" dy="23">p02 下架 → delete；p03 物理删及级联 → delete</tspan><tspan x="271.5" dy="23">p02 重开 → 当前城市、标签、价格重新组装</tspan></text></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-1159507100-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 271 94.5 C 271 141.300003 271 165.699997 271 210.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159507100-3488378134)" mask="url(#d2-1159507100)" /><text x="271" y="159" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">表主键 t02 不变，外键 attraction_id 改变</text></g><g class="KGIgLSZndDsgYylbMF0="><path d="M 271 308.5 C 271 355.299988 271 379.700012 271 424.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159507100-3488378134)" mask="url(#d2-1159507100)" /><text x="271" y="373" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">实测错误做法：只看 after</text></g><g class="KGMgLSZndDsgZClbMF0="><path d="M 271 522.5 C 271 569.299988 271 593.700012 271 638.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159507100-3488378134)" mask="url(#d2-1159507100)" /><text x="271.5" y="587" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">index 完整覆盖；移除旧标签</text></g><g class="KGQgLSZndDsgZSlbMF0="><path d="M 271 736.5 C 271 783.299988 271 807.700012 271 852.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159507100-3488378134)" mask="url(#d2-1159507100)" /><text x="271" y="801" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">删除行不等于可以丢掉旧归属</text></g><g class="KGUgLSZndDsgZilbMF0="><path d="M 271 950.5 C 271 997.299988 271 1021.700012 271 1066.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1159507100-3488378134)" mask="url(#d2-1159507100)" /><text x="271" y="1015" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">孩子变化重算父文档；根删除移除整份文档</text></g><mask id="d2-1159507100" maskUnits="userSpaceOnUse" x="-25" y="-25" width="592" height="1234">
