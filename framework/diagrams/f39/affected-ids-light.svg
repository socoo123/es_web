		.d2-1078281677 .stroke-B2{stroke:#0F66B7;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#000536;--color-border-muted:#0F66B7;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0F66B7;--color-accent-emphasis:#0F66B7;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="YQ== card"><g class="shape" ><rect x="112" y="0" width="351" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="287.5" y="43.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="287.5" dy="0">三张业务表 · 三个事件 topic</tspan><tspan x="287.5" dy="24">city / attraction / attraction_tag</tspan></text></g><g class="Yg== card"><g class="shape" ><rect x="31" y="214" width="513" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="287.5" y="257.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="287.5" dy="0">Java 读取事件中的旧、新归属</tspan><tspan x="287.5" dy="24">FULL before + after；不是把行直接写成文档</tspan></text></g><g class="Yw== card"><g class="shape" ><rect x="104" y="428" width="366" height="114" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="287" y="471.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="287" dy="0">城市 HZ 改名 → p01、p02</tspan><tspan x="287" dy="23">景点 p01 改价 → p01</tspan><tspan x="287" dy="23">标签 t02 转移 → 旧 p01 ∪ 新 p02</tspan></text></g><g class="ZA== card"><g class="shape" ><rect x="25" y="663" width="524" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="287" y="706.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="287" dy="0">每个事件建立只读数据库快照</tspan><tspan x="287" dy="24">受影响 ID 去重；按当前三表重算完整文档</tspan></text></g><g class="ZQ== card"><g class="shape" ><rect x="43" y="877" width="488" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="287" y="920.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="287" dy="0">Bulk 以景点 ID 写入</tspan><tspan x="287" dy="24">open → index 整份；closed / 不存在 → delete</tspan></text></g><g class="Zg== card"><g class="shape" ><rect x="0" y="1091" width="574" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="287" y="1134.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="287" dy="0">核对全部条目后提交该分区 offset</tspan><tspan x="287" dy="24">显式 refresh 后用搜索验证；跨 topic 无全局次序</tspan></text></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-1078281677-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 287 94.5 C 287 141.300003 287 165.699997 287 210.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1078281677-3488378134)" mask="url(#d2-1078281677)" /><text x="287.5" y="159" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Debezium 行事件；key 是表的主键</text></g><g class="KGIgLSZndDsgYylbMF0="><path d="M 287 308.5 C 287 355.299988 287 379.700012 287 424.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1078281677-3488378134)" mask="url(#d2-1078281677)" /><text x="287.5" y="373" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">路由规则决定受影响的景点</text></g><g class="KGMgLSZndDsgZClbMF0="><path d="M 287 543.5 C 287 590.299988 287 614.700012 287 659.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1078281677-3488378134)" mask="url(#d2-1078281677)" /><text x="287" y="608" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">不是三个表各建一个搜索索引</text></g><g class="KGQgLSZndDsgZSlbMF0="><path d="M 287 757.5 C 287 804.299988 287 828.700012 287 873.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1078281677-3488378134)" mask="url(#d2-1078281677)" /><text x="287.5" y="822" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">包含 city_name、tags 与整数分价格</text></g><g class="KGUgLSZndDsgZilbMF0="><path d="M 287 971.5 C 287 1018.299988 287 1042.699951 287 1087.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1078281677-3488378134)" mask="url(#d2-1078281677)" /><text x="287.5" y="1036" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">不构成数据库 / ES / Kafka 的原子事务</text></g><mask id="d2-1078281677" maskUnits="userSpaceOnUse" x="-25" y="-25" width="624" height="1234">
