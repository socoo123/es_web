middle;font-size:21px"><tspan x="345" dy="0">v2 追到 rollback 检查点 next=16</tspan><tspan x="345" dy="24">新价72元、p04已删；v1 仍13，此时拒绝回滚</tspan></text></g><g class="bWlycm9y card"><g class="shape" ><rect x="77" y="856" width="537" height="93" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="345.5" y="899.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="345.5" dy="0">v1 也追到 next=16 并核对完整投影</tspan><tspan x="345.5" dy="24">alias 回到 v1，仍是72元；两版继续消费到19</tspan></text></g><g class="KGZlbmNlIC0mZ3Q7IGdhdGUpWzBd"><marker id="mk-d2-3829409997-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 345 94.5 C 345 141.300003 345 165.699997 345 210.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3829409997-3488378134)" mask="url(#d2-3829409997)" /><text x="345.5" y="159" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">同一分区中先前变化排在标记之前</text></g><g class="KGdhdGUgLSZndDsgc3dpdGNoKVswXQ=="><path d="M 345 308.5 C 345 355.299988 345 379.700012 345 424.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3829409997-3488378134)" mask="url(#d2-3829409997)" /><text x="345" y="373" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">两个固定 ingest alias 不随查询切换</text></g><g class="KHN3aXRjaCAtJmd0OyBuZXcpWzBd"><path d="M 345 522.5 C 345 569.299988 345 593.700012 345 638.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3829409997-3488378134)" mask="url(#d2-3829409997)" /><text x="345.5" y="587" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"