le;font-size:21px"><tspan x="310.5" dy="0">故意让旧全量最后写入 v2</tspan><tspan x="310.5" dy="24">p01 / p02 的修订号1被拒绝；p03 修订号1补入</tspan></text></g><g class="Y2hlY2s= card"><g class="shape" ><rect x="35" y="856" width="550" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="310" y="899.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="310" dy="0">全量完成 + 分区 next=9 + 全字段核对</tspan><tspan x="310" dy="24">两版都有 p01 / 65元、p04 / 45元，p02 不可搜索</tspan></text></g><g class="KGxvdyAtJmd0OyB3cml0ZSlbMF0="><marker id="mk-d2-3770540050-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 310 94.5 C 310 141.300003 310 165.699997 310 210.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3770540050-3488378134)" mask="url(#d2-3770540050)" /><text x="310" y="159" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">起点早于快照；不是从全量结束时开始订阅</text></g><g class="KHdyaXRlIC0mZ3Q7IGRlbHRhKVswXQ=="><path d="M 310 308.5 C 310 355.299988 310 379.700012 310 424.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3770540050-3488378134)" mask="url(#d2-3770540050)" /><text x="310.5" y="373" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">追加 outbox、Debezium 与单分区日志</text></g><g class="KGRlbHRhIC0mZ3Q7IGZ1bGwpWzBd"><path d="M 310 522.5 C 310 569.299988 310 593.700012 310 638.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3770540050-3488378134)" mask="url(#d2-3770540050)" /><text x="310" y="587" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">增量和全量共享同一实体修订号守卫</text></g><g class="KGZ1bGwgLSZndDsgY2hlY2spWzBd"><path d="M 310 736.5 C 310 783.299988 310 807.700012 310 852.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3770540050-3488378134)" mask="url(#d2-3770540050)" /><text x="310" y="801" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">快照不会补回已删除资料，也不会覆盖新价</text></g><mask id="d2-3770540050" maskUnits="userSpaceOnUse" x="-25" y="-25" width="670" height="999">
