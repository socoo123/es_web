		.d2-2732632026 .stroke-B2{stroke:#0F66B7;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#000536;--color-border-muted:#0F66B7;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0F66B7;--color-accent-emphasis:#0F66B7;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="b2xk"><g class="shape" ><rect x="0" y="0" width="352" height="98" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="176" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="176" dy="0">① 空扩展词典下写入 v1</tspan><tspan x="176" dy="17.666667">旧词项：星 / 澜 / 湾</tspan><tspan x="176" dy="17.666667">显式存储 term vector，保留写入证据</tspan></text></g><g class="bG9hZA=="><g class="shape" ><rect x="6" y="219" width="341" height="98" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="176.5" y="257.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="176.5" dy="0">② 写入词典文件，再重启本课节点</tspan><tspan x="176.5" dy="17.666667">当前分析：星澜湾 → 星澜湾</tspan><tspan x="176.5" dy="17.666667">词典加载不修改旧文档</tspan></text></g><g class="bWl4ZWQ="><g class="shape" ><rect x="13" y="438" width="327" height="98" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="176.5" y="476.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="176.5" dy="0">③ 在 v1 新写入两份资料</tspan><tspan x="176.5" dy="17.666667">查询用新词，旧资料仍是旧词项</tspan><tspan x="176.5" dy="17.666667">新资料能命中，旧资料继续漏掉</tspan></text></g><g class="cmVidWlsZA=="><g class="shape" ><rect x="13" y="657" width="327" height="98" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="176.5" y="695.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="176.5" dy="0">④ 暂停 v1 写入，从 _source 重建 v2</tspan><tspan x="176.5" dy="17.666667">目标预先建好 mapping</tspan><tspan x="176.5" dy="17.666667">所有资料按已加载词典重新分析</tspan></text></g><g class="dmVyaWZ5"><g class="shape" ><rect x="13" y="876" width="327" height="98" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="176.5" y="914.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="176.5" dy="0">⑤ 核对已存词项与完整命中 ID</tspan><tspan x="176.5" dy="17.666667">恢复旧景点，也检查新增误匹配</tspan><tspan x="176.5" dy="17.666667">词典不是品牌或地名认证</tspan></text></g><g class="KG9sZCAtJmd0OyBsb2FkKVswXQ=="><marker id="mk-d2-2732632026-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 176 99.5 C 176 146.300003 176 170.699997 176 215.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2732632026-3488378134)" mask="url(#d2-2732632026)" /><text x="176.5" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">发布规则</text></g><g class="KGxvYWQgLSZndDsgbWl4ZWQpWzBd"><path d="M 176 318.5 C 176 365.299988 176 389.700012 176 434.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2732632026-3488378134)" mask="url(#d2-2732632026)" /><text x="176.5" y="383" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">只影响后续分析</text></g><g class="KG1peGVkIC0mZ3Q7IHJlYnVpbGQpWzBd"><path d="M 176 537.5 C 176 584.299988 176 608.700012 176 653.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2732632026-3488378134)" mask="ur