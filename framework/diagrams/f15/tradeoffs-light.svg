Jhc2VsaW5lIC0mZ3Q7IG1peGVkKVswXQ==" style='opacity:0'><marker id="mk-d2-3676439308-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 183.5 116 C 183.5 154 183.5 174 183.5 210" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3676439308-3488378134)" mask="url(#d2-3676439308)" /></g><g class="KG1peGVkIC0mZ3Q7IHJlYnVpbHQpWzBd" style='opacity:0'><path d="M 183.5 330 C 183.5 368 183.5 388 183.5 424" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3676439308-3488378134)" mask="url(#d2-3676439308)" /></g><mask id="d2-3676439308" maskUnits="userSpaceOnUse" x="-25" y="-25" width="417" height="592">
