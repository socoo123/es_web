rect x="0" y="753" width="360" height="130" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="180" y="793" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:22px"><tspan x="180" dy="0">4. 核对五份，再重导入</tspan><tspan x="180" dy="23.5">刷新后 ID、字段与总数均一致</tspan><tspan x="180" dy="23.5">完整重发：updated / version=2</tspan><tspan x="180" dy="23.5">计数仍为 5，不生成重复 ID</tspan></text></g><g class="KHNlbmQgLSZndDsgaW5zcGVjdClbMF0="><marker id="mk-d2-3573691168-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 180 131.5 C 180 178.300003 180 202.699997 180 247.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573691168-3488378134)" mask="url(#d2-3573691168)" /><text x="180.5" y="196" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">批请求不是五条全成或全败</text></g><g class="KGluc3BlY3QgLSZndDsgcmV0cnkpWzBd"><path d="M 180 382.5 C 180 429.299988 180 453.700012 180 498.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573691168-3488378134)" mask="url(#d2-3573691168)" /><text x="180.5" y="447" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">成功项保留，失败项才修复</text></g><g class="KHJldHJ5IC0mZ3Q7IHZlcmlmeSlbMF0="><path d="M 180 633.5 C 180 680.299988 180 704.700012 180 749.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3573691168-3488378134)" mask="url(#d2-3573691168)" /><text x="180.5" y="698" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">不能只看 errors=false</text></g><mask id="d2-3573691168" maskUnits="userSpaceOnUse" x="-25" y="-25" width="410" height="