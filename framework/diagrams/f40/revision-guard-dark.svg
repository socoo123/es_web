px">演示跨 topic 的逆序交付</text></g><g class="KG9sZCAtJmd0OyBnb25lKVswXQ=="><path d="M 285.5 522.5 C 285.5 569.299988 285.5 593.700012 285.5 638.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3856493628-3488378134)" mask="url(#d2-3856493628)" /><text x="286" y="587" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">删除也必须携带递增版本</text></g><g class="KGdvbmUgLSZndDsgcmVwbGF5KVswXQ=="><path d="M 285.5 736.5 C 285.5 783.299988 285.5 807.700012 285.5 852.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3856493628-3488378134)" mask="url(#d2-3856493628)" /><text x="285.5" y="801" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">保留标记期间，不依赖 ES 短期删除版本</text></g><g class="KHJlcGxheSAtJmd0OyBvcGVuKVswXQ=="><path d="M 285.5 950.5 C 285.5 997.299988 285.5 1021.700012 285.5 1066.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3856493628-3488378134)" mask="url(#d2-3856493628)" /><text x="286" y="1015" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">合法新状态仍可前进</text></g><mask id="d2-3856493628" maskUnits="userSpaceOnUse" x="-25" y="-25" width="621" height="1213">
