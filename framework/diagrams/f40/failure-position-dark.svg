nt-size:21px"><tspan x="279" dy="0">明确选择 park 后重启，再处理同一批</tspan><tspan x="279" dy="24">p01=noop、p02=400、p03=noop</tspan></text></g><g class="ZQ== card"><g class="shape" ><rect x="42" y="856" width="473" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="278.5" y="899.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="278.5" dy="0">p02 原消息、错误和来源位置写入 DLQ</tspan><tspan x="278.5" dy="24">等 broker 确认；失败则仍不提交</tspan></text></g><g class="Zg== card"><g class="shape" ><rect x="25" y="1070" width="508" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="279" y="1113.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="279" dy="0">全部条目已有明确去向，才提交 next = 10</tspan><tspan x="279" dy="24">p02 搜索资料仍旧；隔离不等于业务修复</tspan></text></g><g class="Zw== card"><g class="shape" ><rect x="23" y="1284" width="512" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="279" y="1327.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="279" dy="0">审核纠正 p02 载荷，经同一版本守卫重放</tspan><tspan x="279" dy="24">字段正确后 refresh 搜索；重复修复 noop</tspan></text></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-3659553099-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 278.5 94.5 C 278.5 141.300003 278.5 165.699997 278.5 210.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3659553099-3488378134)" mask="url(#d2-3659553099)" /><text x="278.5" y="159" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">逐条检查 ID、status 与 