F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="239.5" dy="0">同组还有 FZ 的 r04</tspan><tspan x="239.5" dy="23">routing 不是城市过滤，也不是访问权限</tspan></text></g><g class="cmVzdWx0 card"><g class="shape" ><rect x="52" y="868" width="376" height="91" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="240" y="910.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="240" dy="0">完整 query 均得到 r01、r02</tspan><tspan x="240" dy="23">只改 routing=SH 会漏掉杭州资料</tspan></text></g><g class="KHF1ZXN0aW9uIC0mZ3Q7IHNjb3BlKVswXQ=="><marker id="mk-d2-3767548057-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 239.5 92.5 C 239.5 139.300003 239.5 163.699997 239.5 208.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3767548057-3488378134)" mask="url(#d2-3767548057)" /><text x="239.5" y="157" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">决定目标组</text></g><g class="KHNjb3BlIC0mZ3Q7IGNvcHkpWzBd"><path d="M 239.5 324.5 C 239.5 371.299988 239.5 395.700012 239.5 440.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3767548057-3488378134)" mask="url(#d2-3767548057)" /><text x="240" y="389" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">选择读取拷贝</text></g><g class="KGNvcHkgLSZndDsgZmlsdGVyKVswXQ=="><path d="M 239.5 536.5 C 239.5 583.299988 239.5 607.700012 239.5 652.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3767548057-3488378134)" mask="url(#d2-3767548057)" /><text x="240" y="601" fill="#BBBEC9" class="text-italic fill-N2" style="text-an