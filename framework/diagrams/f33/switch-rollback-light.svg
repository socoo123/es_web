		.d2-1596253269 .stroke-B2{stroke:#0F66B7;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#000536;--color-border-muted:#0F66B7;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0F66B7;--color-accent-emphasis:#0F66B7;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="YmVmb3Jl"><g class="shape" ><rect x="0" y="0" width="671" height="342" stroke="#000536" fill="#87BFF3" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="335.5" y="28" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:23px">A · 暂停写入，完成新旧核对</text></g><g class="c3dhcA=="><g class="shape" ><rect x="0" y="382" width="671" height="473" stroke="#000536" fill="#87BFF3" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="335.5" y="410" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:23px">B · 一次 _aliases 更新两个入口</text></g><g class="cm9sbGJhY2s="><g class="shape" ><rect x="0" y="895" width="671" height="473" stroke="#000536" fill="#87BFF3" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="335.5" y="923" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:23px">C · 回滚窗口与恢复写入分开</text></g><g class="YmVmb3JlLmE= card"><g class="shape" ><rect x="60" y="60" width="520" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="320" y="102.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="320" dy="0">浏览器 → 同一 Java 进程 → attractions-read → v001</tspan><tspan x="320" dy="23">写入任务 → attractions-write → v001（写阻断）</tspan></text></g><g class="YmVmb3JlLmI= card"><g class="shape" ><rect x="60" y="191" width="520" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="320" y="233.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="320" dy="0">read / write 均只挂一版；_source 集合相同</tspan><tspan x="320" dy="23">目标 v002 的字段规则和代表查询另行验证</tspan></text></g><g class="c3dhcC5h card"><g class="shape" ><rect x="60" y="442" width="535" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="327.5" y="484.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="327.5" dy="0">remove v001 的 read / write，均 must_exist = true</tspan><tspan x="327.5" dy="23">add v002 的 read = false、write = true</tspan></text></g><g class="c3dhcC5i card"><g class="shape" ><rect x="60" y="573" width="535" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="327.5" y="615.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="327.5" dy="0">四动作一起提交；回读实际 alias，再发新请求</tspan><tspan x="327.5" dy="23">Java 配置与进程不变：西湖命中 p01、p07</tspan></text></g><g class="c3dhcC5j card"><g class="shape" ><rect x="60" y="704" width="535" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="327.5" y="746.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="327.5" dy="0">原子性覆盖入口关系，不复制文档</tspan><tspan x="327.5" dy="23">不取消在途请求，不提供跨读写请求的事务</tspan></text></g><g class="cm9sbGJhY2suYQ== card"><g class="shape" ><rect x="60" y="955" width="551" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="335.5" y="997.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="335.5" dy="0">窗口内未写新版：反向四动作 → 回旧版</tspan><tspan x="335.5" dy="23">资料未丢，但 keyword 的旧召回行为也随之回来</tspan></text></g><g class="cm9sbGJhY2suYg== card"><g class="shape" ><rect x="60" y="1086" width="551" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="335.5" y="1128.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="335.5" dy="0">再次切到新版，再允许写入 p08 → 只落 v002</tspan><tspan x="335.5" dy="23">v001 无 p08，此时不能仅反向 alias 宣称安全回滚</tspan></text></g><g class="cm9sbGJhY2suYw== card"><g class="shape" ><rect x="60" y="1217" width="551" height="91" rx="10" stroke="#000536" fill="#BCDDFB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="335.5" y="1259.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="335.5" dy="0">旧版保留用于核对，不是备份</tspan><tspan x="335.5" dy="23">F34 学独立快照恢复；F41 学持续变更与追平</tspan></text></g><mask id="d2-1596253269" maskUnits="userSpaceOnUse" x="-25" y="-25" width="721" height="1418">
<rect x="-25" y="-25" width="721" height="1418" fill="white"></rect>

