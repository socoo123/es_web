hor:middle;font-size:21px"><tspan x="245" dy="0">锁住合作写入者，重查当前 SQL</tspan><tspan x="245" dy="23">来源已变：拒绝旧计划，建立新边界</tspan><tspan x="245" dy="23">来源未变：emit 更高修订号的完整事件</tspan></text></g><g class="dmVyaWZ5 card"><g class="shape" ><rect x="48" y="898" width="394" height="114" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="245" y="941.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="245" dy="0">补偿后新建来源边界 H=12</tspan><tspan x="245" dy="23">条级成功 → next=12 → refresh</tspan><tspan x="245" dy="23">完整字段 / 删除 / 游客查询复验</tspan></text></g><g class="KGJvdW5kYXJ5IC0mZ3Q7IGNvbXBhcmUpWzBd"><marker id="mk-d2-3509415434-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 245 115.5 C 245 162.300003 245 186.699997 245 231.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3509415434-3488378134)" mask="url(#d2-3509415434)" /><text x="245" y="180" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">条数相等不能验收</text></g><g class="KGNvbXBhcmUgLSZndDsgcGxhbilbMF0="><path d="M 245 329.5 C 245 376.299988 245 400.700012 245 445.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3509415434-3488378134)" mask="url(#d2-3509415434)" /><text x="245.5" y="394" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">指纹相同也要比较实际字段</text></g><g class="KHBsYW4gLSZndDsgcmVwYWlyKVswXQ=="><path d="M 245 543.5 C 245 590.299988 245 614.700012 245 659.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3509415434-3488378134)" mask="url(#d2-3509415434)" /><text x="245.5" y="608" fill="#BBBEC9" class=