text-anchor:middle;font-size:21px"><tspan x="350" dy="0">④ ES 条级成功，再提交 next=4</tspan><tspan x="350" dy="24">实时 GET 已65元；搜索仍60元；写入确认独立留档</tspan></text></g><g class="c2VhcmNo card"><g class="shape" ><rect x="89" y="856" width="523" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="350.5" y="899.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="350.5" dy="0">⑤ refresh 后搜索首次观测到65元</tspan><tspan x="350.5" dy="24">记录最后旧值与首次新值之间的探测区间</tspan></text></g><g class="KGRiIC0mZ3Q7IGNhcHR1cmUpWzBd"><marker id="mk-d2-1429801439-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 350 94.5 C 350 141.300003 350 165.699997 350 210.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429801439-3488378134)" mask="url(#d2-1429801439)" /><text x="350.5" y="159" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">对照 source.ts_ms / ts_ms；跨时钟差只能估计</text></g><g class="KGNhcHR1cmUgLSZndDsgY29uc3VtZXIpWzBd"><path d="M 350 308.5 C 350 355.299988 350 379.700012 350 424.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429801439-3488378134)" mask="url(#d2-1429801439)" /><text x="350" y="373" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">end=4 / next=3 说明已在消息层积压</text></g><g class="KGNvbnN1bWVyIC0mZ3Q7IGFjaylbMF0="><path d="M 350 522.5 C 350 569.299988 350 593.700012 350 638.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429801439-3488378134)" mask="url(#d2-1429801439)" /><text x="350.5" y="587" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">投影错误、条级失败、提交位置分别检查</text></g><g class="KGFjayAtJmd0OyBzZWFyY2gpWzBd"><path d="M 350 736.5 C 350 783.299988 350 807.700012 350 852.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1429801439-3488378134)" mask="url(#d2-1429801439)" /><text x="350" y="801" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">本课 refresh_interval=-1，主动刷新以固定对照</text></g><mask id="d2-1429801439" maskUnits="userSpaceOnUse" x="-25" y="-25" width="750" height="999">
