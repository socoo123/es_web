/g><text x="183.5" y="653.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="183.5" dy="0">短语：name + slop=0</tspan><tspan x="183.5" dy="17.666667">要求词项位置相邻：3份</tspan><tspan x="183.5" dy="17.666667">故，宫主题展仍在，不等于字面子串</tspan></text></g><g class="KGluZGV4ZWQgLSZndDsgd3JvbmcpWzBd"><marker id="mk-d2-318314829-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 183.5 99.5 C 183.5 146.300003 183.5 170.699997 183.5 215.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-318314829-3488378134)" mask="url(#d2-318314829)" /><text x="184" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">比较索引与查询词项</text></g><g class="KHdyb25nIC0mZ3Q7IGFsaWduZWQpWzBd" style='opacity:0'><path d="M 183.5 319 C 183.5 357 183.5 377 183.5 413" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-318314829-3488378134)" mask="url(#d2-318314829)" /></g><g class="KGFsaWduZWQgLSZndDsgcGhyYXNlKVswXQ==" style='opacity:0'><path d="M 183.5 517 C 183.5 555 183.5 575 183.5 611" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-318314829-3488378134)" mask="url(#d2-318314829)" /></g><mask id="d2-318314829" maskUnits="userSpaceOnUse" x="-25" y="-25" width="417" height="763">
