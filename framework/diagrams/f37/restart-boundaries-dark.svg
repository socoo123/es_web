="text-anchor:middle;font-size:21px"><tspan x="331" dy="0">启动原 worker · 从保存的位置继续</tspan><tspan x="331" dy="24">Kafka 收到 u / c / d + tombstone；本轮没有新增 r</tspan></text></g><g class="ZQ== card"><g class="shape" ><rect x="35" y="856" width="593" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="331.5" y="899.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="331.5" dy="0">Java 尚未消费 · Kafka 已新，ES 仍旧</tspan><tspan x="331.5" dy="24">以同一个 group 继续，成功写入后提交下一 offset</tspan></text></g><g class="Zg== card"><g class="shape" ><rect x="70" y="1070" width="522" height="93" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="331" y="1113.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:21px"><tspan x="331" dy="0">显式 refresh 并核对完整字段与删除</tspan><tspan x="331" dy="24">p01 = 7000 分、p04 = 1800 分；p02 / p03 不存在</tspan></text></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-4122686621-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 331 94.5 C 331 141.300003 331 165.699997 331 210.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4122686621-3488378134)" mask="url(#d2-4122686621)" /><text x="331" y="159" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">本课受控停机</text></g><g class="KGIgLSZndDsgYylbMF0="><path d="M 331 308.5 C 331 355.299988 331 379.700012 331 424.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4122686621-3488378134)" mask="url(#d2-4122686621)" /><text x="331" y="373" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">提交 offline.sql</text></g><g class="KGMgLSZndDsgZClbMF0="><path d="M 331 522.5 C 331 569.299988 331 593.700012 331 638.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4122686621-3488378134)" mask="url(#d2-4122686621)" /><text x="331" y="587" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">确认 slot 未 lost，恢复读取</text></g><g class="KGQgLSZndDsgZSlbMF0="><path d="M 331 736.5 C 331 783.299988 331 807.700012 331 852.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4122686621-3488378134)" mask="url(#d2-4122686621)" /><text x="331.5" y="801" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">先观察中间状态</text></g><g class="KGUgLSZndDsgZilbMF0="><path d="M 331 950.5 C 331 997.299988 331 1021.700012 331 1066.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4122686621-3488378134)" mask="url(#d2-4122686621)" /><text x="331.5" y="1015" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">消费、写入、refresh、搜索</text></g><mask id="d2-4122686621" maskUnits="userSpaceOnUse" x="-25" y="-25" width="712" height="1213">
