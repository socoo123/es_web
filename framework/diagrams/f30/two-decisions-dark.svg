		.d2-2154342988 .stroke-B2{stroke:#6B8AFB;}.appendix text.text{fill:#F4F6FA}.md{--color-fg-default:#F4F6FA;--color-fg-muted:#BBBEC9;--color-fg-subtle:#868A96;--color-canvas-default:#000410;--color-canvas-subtle:#191C28;--color-border-default:#F4F6FA;--color-border-muted:#6B8AFB;--color-neutral-muted:#191C28;--color-accent-fg:#6B8AFB;--color-accent-emphasis:#6B8AFB;--color-attention-subtle:#BBBEC9;--color-danger-fg:red;}.light-code{display: none}.dark-code{display: block}]]></style><g class="Y29udHJvbA=="><g class="shape" ><rect x="0" y="0" width="577" height="342" stroke="#F4F6FA" fill="#070B67" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="288.5" y="28" fill="#F4F6FA" class="text fill-N1" style="text-anchor:middle;font-size:23px">控制面 · m1 / m2 / m3 三票</text></g><g class="ZGF0YQ=="><g class="shape" ><rect x="0" y="382" width="577" height="473" stroke="#F4F6FA" fill="#070B67" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="288.5" y="410" fill="#F4F6FA" class="text fill-N1" style="text-anchor:middle;font-size:23px">数据与入口 · 分别观察</text></g><g class="Y29udHJvbC5h card"><g class="shape" ><rect x="60" y="60" width="457" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="288.5" y="102.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="288.5" dy="0">稳定配置需要至少 2 票</tspan><tspan x="288.5" dy="23">停 1 个候选：余下 2 票仍可选 master</tspan></text></g><g class="Y29udHJvbC5i card"><g class="shape" ><rect x="60" y="191" width="457" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="288.5" y="233.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="288.5" dy="0">停 m1 + m2：只剩 m3 的 1 票</tspan><tspan x="288.5" dy="23">无 master；默认拒绝写入和元数据变更</tspan></text></g><g class="ZGF0YS5h card"><g class="shape" ><rect x="60" y="442" width="455" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="287.5" y="484.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="287.5" dy="0">m3 / d1 都在线：两份景点仍可达</tspan><tspan x="287.5" dy="23">失去多数时，本课仍从 d1 读到 p01 / p02</tspan></text></g><g class="ZGF0YS5i card"><g class="shape" ><rect x="60" y="573" width="455" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="287.5" y="615.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="287.5" dy="0">Java 只连接 m1：m1 停机就连不上</tspan><tspan x="287.5" dy="23">不能据此断言活 d1 的读取也被阻止</tspan></text></g><g class="ZGF0YS5j card"><g class="shape" ><rect x="60" y="704" width="455" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="287.5" y="746.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="287.5" dy="0">停 m3 + d1：两份业务数据都离线</tspan><tspan x="287.5" dy="23">m1 / m2 仍有 2 票，但景点搜索失败</tspan></text></g><mask id="d2-2154342988" maskUnits="userSpaceOnUse" x="-25" y="-25" width="627" height="905">
