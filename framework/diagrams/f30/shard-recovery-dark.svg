ass="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="250.5" dy="0">再同时停 m3 / d1</tspan><tspan x="250.5" dy="22">m1 / m2 保留 2 票与 master；业务主片不可用</tspan><tspan x="250.5" dy="22">red：搜索 / 写入失败，元数据仍可修改</tspan></text></g><g class="ZQ== card"><g class="shape" ><rect x="16" y="908" width="469" height="111" rx="10" stroke="#F4F6FA" fill="#3733E9" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="250.5" y="950.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="250.5" dy="0">两数据节点带原卷回归</tspan><tspan x="250.5" dy="22">等待分片 STARTED，再核对 6 份完整字段</tspan><tspan x="250.5" dy="22">恢复后的 p01 = 7000 分</tspan></text></g><g class="KGEgLSZndDsgYilbMF0="><marker id="mk-d2-2504931404-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 250.5 92.5 C 250.5 139.300003 250.5 163.699997 250.5 208.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2504931404-3488378134)" mask="url(#d2-2504931404)" /><text x="251" y="157" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">检测节点失联后重新分配角色</text></g><g class="KGIgLSZndDsgYylbMF0="><path d="M 250.5 324.5 C 250.5 371.299988 250.5 395.700012 250.5 440.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2504931404-3488378134)" mask="url(#d2-2504931404)" /><text x="251" y="389" fill="#BBBEC9" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">回归与同步，不能只看进程启动</text></g><g class="KGMgLSZndDsgZClbMF0="><path d="M 250.5 556.5 C 250.5 603.299988 250.5 627.700012 250.5 672.5" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2504931404-3488378134)" mask="url(#d2-2504931404)" /><t