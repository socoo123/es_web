17.5" dy="0">tut-f31-attractions：2 主 / routing shards = 8</tspan><tspan x="317.5" dy="23">添加节点只改变放置；不会自动改变主片数</tspan></text></g><g class="c3BsaXQuYQ== card"><g class="shape" ><rect x="60" y="311" width="515" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="317.5" y="353.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="317.5" dy="0">源停止写入，目标不存在，磁盘可容纳操作</tspan><tspan x="317.5" dy="23">4 是 2 的倍数，且整除显式 routing shards 8</tspan></text></g><g class="c3BsaXQuYg== card"><g class="shape" ><rect x="60" y="442" width="515" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="317.5" y="484.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="317.5" dy="0">目标 3 不满足倍数；目标 6 不整除 8</tspan><tspan x="317.5" dy="23">本课合法：2 → 4；不是原索引原地加片</tspan></text></g><g class="c2hyaW5rLmE= card"><g class="shape" ><rect x="60" y="693" width="509" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="314.5" y="735.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="314.5" dy="0">split4 源停止写入、绿色</tspan><tspan x="314.5" dy="23">每个源分片至少一份同在 n1；2 整除 4</tspan></text></g><g class="c2hyaW5rLmI= card"><g class="shape" ><rect x="60" y="824" width="509" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="314.5" y="866.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="314.5" dy="0">四片分散两节点时拒绝；集中后 4 → 2</tspan><tspan x="314.5" dy="23">目标清除临时 require；仍须核对字段与查询</tspan></text></g><g class="cmVpbmRleC5h card"><g class="shape" ><rect x="60" y="1075" width="515" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="317.5" y="1117.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="317.5" dy="0">另建 3 主目标及完整 mapping；源可读 _source</tspan><tspan x="317.5" dy="23">重新读取并写入文档；不用 split 的倍数条件</tspan></text></g><g class="cmVpbmRleC5i card"><g class="shape" ><rect x="60" y="1206" width="515" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="317.5" y="1248.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="317.5" dy="0">三个目标都不是持续同步链路</tspan><tspan x="317.5" dy="23">源 p01 后改成 65 元，目标仍是快照中的 60 元</tspan></text></g><mask id="d2-1335107184" maskUnits="userSpaceOnUse" x="-25" y="-25" width="685" height="1407">
