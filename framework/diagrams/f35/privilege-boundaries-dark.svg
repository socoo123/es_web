t x="322" y="233.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="322" dy="0">搜索 p01 / p02；不授予 cluster monitor</tspan><tspan x="322" dy="23">拒绝写入、物理名读取和安全管理</tspan></text></g><g class="d3JpdGVyLmE= card"><g class="shape" ><rect x="60" y="442" width="596" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="358" y="484.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="358" dy="0">write alias 上的 index + delete 权限</tspan><tspan x="358" dy="23">可覆盖 p01 / 删除 p02；不授予搜索、refresh 或建索引</tspan></text></g><g class="YWRtaW4uYQ== card"><g class="shape" ><rect x="60" y="693" width="572" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="346" y="735.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="346" dy="0">预建 mapping / alias、管理用户与密钥、执行 refresh</tspan><tspan x="346" dy="23">不把 elastic 管理凭据交给 Java 搜索服务</tspan></text></g><g class="YWRtaW4uYg== card"><g class="shape" ><rect x="60" y="824" width="572" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="346" y="866.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="346" dy="0">替换密钥文件不会更新已建客户端</tspan><tspan x="346" dy="23">本课撤销旧 key → 替换文件 → 重启 Java → 核对恢复</tspan></text></g><mask id="d2-3479135216" maskUnits="userSpaceOnUse" x="-25" y="-25" width="766" height="1025">
