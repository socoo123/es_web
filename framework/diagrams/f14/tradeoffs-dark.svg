3Q7IG1heClbMF0=" style='opacity:0'><marker id="mk-d2-3833992109-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#F4F6FA" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 207.5 116 C 207.5 154 207.5 174 207.5 210" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833992109-3488378134)" mask="url(#d2-3833992109)" /></g><g class="KG1heCAtJmd0OyBhbmRjYXNlKVswXQ==" style='opacity:0'><path d="M 207.5 330 C 207.5 368 207.5 388 207.5 424" stroke="#F4F6FA" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3833992109-3488378134)" mask="url(#d2-3833992109)" /></g><mask id="d2-3833992109" maskUnits="userSpaceOnUse" x="-25" y="-25" width="465" height="592">
