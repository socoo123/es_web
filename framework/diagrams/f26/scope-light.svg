="stroke-width:2;" /></g><text x="210" y="738.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="210" dy="0">全部10条候选逐晚核对</tspan><tspan x="210" dy="22">7条合格offer / 4家合格酒店</tspan><tspan x="210" dy="22">h04 / h05 / h01 / h02</tspan></text></g><g class="bGltaXQ= card"><g class="shape" ><rect x="14" y="928" width="391" height="111" rx="10" stroke="#000536" fill="#E5F3FF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="209.5" y="970.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="209.5" dy="0">精确只属于这份固定快照与条件</tspan><tspan x="209.5" dy="22">两晚 / 一间 / CNY，不含税费</tspan><tspan x="209.5" dy="22">省略实时供价、并发更新和订单</tspan></text></g><g class="KG9mZmVycyAtJmd0OyBob3RlbHMpWzBd"><marker id="mk-d2-1580259021-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 209.5 112.5 C 209.5 159.300003 209.5 183.699997 209.5 228.5" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1580259021-3488378134)" mask="url(#d2-1580259021)" /><text x="209.5" y="177" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">扩大酒店内范围</text></g><g class="KGhvdGVscyAtJmd0OyBvdXRzaWRlKVswXQ=="><marker id="mk-d2-1580259021-2177206569" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0F66B7" class="connection fill-B2" stroke-width="2" /> </marker><path d="M 209.5 344.5 C 209.5 391.299988 209.5 415.700012 209.5 460.5" stroke="#0F66B7" fill="none" class="connection stroke-B2" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-1580259021-2177206569)" mask="url(#d2-1580259021)" /><text x="209.5" y="409" fill=