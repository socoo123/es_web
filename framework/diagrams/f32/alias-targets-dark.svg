roke-width:2;" /></g><text x="292.5" y="233.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="292.5" dy="0">读 v001：p01 为 60 元</tspan><tspan x="292.5" dy="23">误读 v001 + v002：4 条命中，业务 ID 重复</tspan></text></g><g class="cmVhZC5j card"><g class="shape" ><rect x="60" y="322" width="465" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="292.5" y="364.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="292.5" dy="0">读空 v003：HTTP 200，0 条</tspan><tspan x="292.5" dy="23">修到 v002：p01 为 65 元；应用没有重启</tspan></text></g><g class="d3JpdGUuYQ== card"><g class="shape" ><rect x="60" y="573" width="456" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="288" y="615.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="288" dy="0">写入任务 → write alias → 唯一写索引</tspan><tspan x="288" dy="23">最终 v001 = false，v002 = true，p08 落 v002</tspan></text></g><g class="d3JpdGUuYg== card"><g class="shape" ><rect x="60" y="704" width="456" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="288" y="746.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="288" dy="0">is_write_index 只决定写入目标</tspan><tspan x="288" dy="23">用这个 alias 搜索仍会覆盖两个目标</tspan></text></g><g class="d3JpdGUuYw== card"><g class="shape" ><rect x="60" y="835" width="456" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="288" y="877.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="288" dy="0">require_alias = true 检查目标确为 alias</tspan><tspan x="288" dy="23">它不验证指向、字段或资料是否正确</tspan></text></g><g class="Ym91bmRhcnkuYQ== card"><g class="shape" ><rect x="60" y="1086" width="483" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="301.5" y="1128.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="301.5" dy="0">两个 alias 独立，不复制或追平数据</tspan><tspan x="301.5" dy="23">v001 有 p07；v002 有 p08；没有跨版本去重</tspan></text></g><g class="Ym91bmRhcnkuYg== card"><g class="shape" ><rect x="60" y="1217" width="483" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="301.5" y="1259.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="301.5" dy="0">read / write 是本课命名约定</tspan><tspan x="301.5" dy="23">授权与凭据留给 F35；迁移流程留给 F33</tspan></text></g><mask id="d2-352829071" maskUnits="userSpaceOnUse" x="-25" y="-25" width="653" height="1418">
