模式：priority 200 胜过 100</tspan><tspan x="305" dy="23">低优先级模板的字段不会补进来</tspan></text></g><g class="Y2hvb3NlLmI= card"><g class="shape" ><rect x="60" y="191" width="490" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="305" y="233.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="305" dy="0">version 是维护者的版本标记</tspan><tspan x="305" dy="23">模拟不创建索引；同优先级重叠会被拒绝</tspan></text></g><g class="Y29tcG9zZS5h card"><g class="shape" ><rect x="60" y="442" width="384" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="252" y="484.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="252" dy="0">composed_of 按顺序合并组件</tspan><tspan x="252" dy="23">再应用 index template 自身的配置</tspan></text></g><g class="Y29tcG9zZS5i card"><g class="shape" ><rect x="60" y="573" width="384" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="252" y="615.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="252" dy="0">本课修复后：2 主 / 每主 1 副</tspan><tspan x="252" dy="23">strict 字段 + whitespace 名称分析</tspan></text></g><g class="Y3JlYXRlLmE= card"><g class="shape" ><rect x="60" y="824" width="460" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="290" y="866.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="290" dy="0">空请求创建 v002：继承当前模板</tspan><tspan x="290" dy="23">显式创建设置优先：v004 改为 3 主 / 0 副</tspan></text></g><g class="bGF0ZXIuYQ== card"><g class="shape" ><rect x="60" y="1075" width="422" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="271" y="1117.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="271" dy="0">v001 / v002：仍 refresh = -1</tspan><tspan x="271" dy="23">v003：1s，且有新增 source_note 字段</tspan></text></g><g class="bGF0ZXIuYg== card"><g class="shape" ><rect x="60" y="1206" width="422" height="91" rx="10" stroke="#F4F6FA" fill="#0B1197" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="271" y="1248.5" fill="#F4F6FA" class="text-bold fill-N1" style="text-anchor:middle;font-size:20px"><tspan x="271" dy="0">模板不复制文档，不改变应用入口</tspan><tspan x="271" dy="23">还要读实际 settings / mapping / alias</tspan></text></g><mask id="d2-2184887516" maskUnits="userSpaceOnUse" x="-25" y="-25" width="660" height="1407">
