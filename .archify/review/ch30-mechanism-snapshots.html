<!DOCTYPE html><html><body><svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="从受控请求开始"><defs><marker id="ch30-finale-arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">从受控请求开始</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">A1–A5：明确数据与环境</text><text x="195" y="140" text-anchor="middle" class="fig-sub">ES 9.4.0 / Lucene 10.4.0</text><text x="195" y="163" text-anchor="middle" class="fig-sub">一主片零副本；strict mapping</text><text x="195" y="186" text-anchor="middle" class="fig-sub">定时refresh关闭；doc1显式刷新</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">先写可验证的笔记</text><text x="565" y="140" text-anchor="middle" class="fig-sub">路径 /tut-l30-docs/_search</text><text x="565" y="163" text-anchor="middle" class="fig-sub">本例是单节点、单分片</text><text x="565" y="186" text-anchor="middle" class="fig-sub">不能据此证明多节点网络两跳</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">证据先限定前提，再解释机制。</text></svg>
<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="REST 接头：路径、TYPE 与三套名字"><defs><marker id="ch30-finale-arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">REST 接头：路径、TYPE 与三套名字</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">HTTP 适配</text><text x="195" y="140" text-anchor="middle" class="fig-sub">routes() 确认路径与方法</text><text x="195" y="163" text-anchor="middle" class="fig-sub">prepareRequest 构造内部请求</text><text x="195" y="186" text-anchor="middle" class="fig-sub">execute(TransportSearchAction.TYPE)</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">三套名字</text><text x="565" y="140" text-anchor="middle" class="fig-sub">REST usage：search_action</text><text x="565" y="163" text-anchor="middle" class="fig-sub">Action：indices:data/read/search</text><text x="565" y="186" text-anchor="middle" class="fig-sub">相位：query / fetch 等后缀</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">安全开启时：HTTP认证与后续Action授权是不同边界。</text></svg>
<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="协调入口：一份状态快照"><defs><marker id="ch30-finale-arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">协调入口：一份状态快照</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">选本次搜索目标</text><text x="195" y="140" text-anchor="middle" class="fig-sub">clusterService.state()</text><text x="195" y="163" text-anchor="middle" class="fig-sub">用取得的状态解析索引与分片</text><text x="195" y="186" text-anchor="middle" class="fig-sub">快照不代表所有节点同时最新</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">单分片与多分片</text><text x="565" y="140" text-anchor="middle" class="fig-sub">搜索通常选每个目标分片一份副本</text><text x="565" y="163" text-anchor="middle" class="fig-sub">本地执行不一定走网络</text><text x="565" y="186" text-anchor="middle" class="fig-sub">普通单分片可在Query内完成Fetch</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">图1展示多分片职责；本课API只验证单分片响应。</text></svg>
<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="同为400，发生位置不同"><defs><marker id="ch30-finale-arrow-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">同为400，发生位置不同</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">B2：解析失败</text><text x="195" y="140" text-anchor="middle" class="fig-sub">非法search_type</text><text x="195" y="163" text-anchor="middle" class="fig-sub">prepareRequest抛异常</text><text x="195" y="186" text-anchor="middle" class="fig-sub">未到usage计数点</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">B3：分片预处理失败</text><text x="565" y="140" text-anchor="middle" class="fig-sub">from+size=10010 &gt; 10000</text><text x="565" y="163" text-anchor="middle" class="fig-sub">DefaultSearchContext.preProcess</text><text x="565" y="186" text-anchor="middle" class="fig-sub">已通过REST准备，会增加usage</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">窗口检查在分片主Query前；不能写成协调扇出前。</text></svg>
<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Query 与 Fetch：保留目标，再取字段"><defs><marker id="ch30-finale-arrow-5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">Query 与 Fetch：保留目标，再取字段</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">普通分页 Query</text><text x="195" y="140" text-anchor="middle" class="fig-sub">读取外部搜索视图</text><text x="195" y="163" text-anchor="middle" class="fig-sub">分片候选受from+size等条件约束</text><text x="195" y="186" text-anchor="middle" class="fig-sub">返回条数可少于窗口</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">协调归并与 Fetch</text><text x="565" y="140" text-anchor="middle" class="fig-sub">普通多分片归并候选</text><text x="565" y="163" text-anchor="middle" class="fig-sub">按持有者分组目标docId</text><text x="565" y="186" text-anchor="middle" class="fig-sub">Fetch可取_source及其他字段</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">void + listener表示结果协议，不单独保证换线程或非阻塞。</text></svg>
<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="C1–C6：把可见性差异变成证据"><defs><marker id="ch30-finale-arrow-6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">C1–C6：把可见性差异变成证据</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">显式refresh前</text><text x="195" y="140" text-anchor="middle" class="fig-sub">SEARCH purple：0</text><text x="195" y="163" text-anchor="middle" class="fig-sub">默认realtime GET：found=true</text><text x="195" y="186" text-anchor="middle" class="fig-sub">realtime=false GET：404</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">显式refresh后</text><text x="565" y="140" text-anchor="middle" class="fig-sub">_shards.successful=1</text><text x="565" y="163" text-anchor="middle" class="fig-sub">新SEARCH purple：1</text><text x="565" y="186" text-anchor="middle" class="fig-sub">查询不变，新读者视图改变</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">GET响应不证明必从translog读；refresh不保证每次产生新段。</text></svg>
<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="方法回放：源码、测试、API 各有用途"><defs><marker id="ch30-finale-arrow-7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" class="fig-arrowhead"/></marker></defs><rect x="20" y="14" width="720" height="56" rx="10" class="fig-box-hot"/><text x="380" y="47" text-anchor="middle" class="fig-name">方法回放：源码、测试、API 各有用途</text><rect x="20" y="90" width="350" height="134" rx="10" class="fig-box-hot"/><text x="195" y="115" text-anchor="middle" class="fig-name">查到约束</text><text x="195" y="140" text-anchor="middle" class="fig-sub">REST解析：RestSearchActionTests</text><text x="195" y="163" text-anchor="middle" class="fig-sub">HTTP窗口：search/30_limits.yml</text><text x="195" y="186" text-anchor="middle" class="fig-sub">归并：SearchPhaseControllerTests</text><rect x="390" y="90" width="350" height="134" rx="10" class="fig-box"/><text x="565" y="115" text-anchor="middle" class="fig-name">记录与重做</text><text x="565" y="140" text-anchor="middle" class="fig-sub">对照状态、error.type、失败分片</text><text x="565" y="163" text-anchor="middle" class="fig-sub">usage基线N → N+5</text><text x="565" y="186" text-anchor="middle" class="fig-sub">点名清理；重建并重记N</text><rect x="20" y="244" width="720" height="48" rx="10" class="fig-box"/><text x="380" y="273" text-anchor="middle" class="fig-sub">看见差异，回到实际检查点；存在测试不等于已运行测试。</text></svg></body></html>
